[project]
name = "journal"
version = "0.1.0"
description = "A private, local journal with Stoic reflections"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "tzdata>=2024.1",
    "python-dotenv>=1.0",
    "anthropic>=1.11.0",
    "cryptography>=50.0.2",
    "authlib>=1.8.0",
    "requests>=2.34.2",
    "gunicorn>=26.2.0 ; sys_platform != 'win32'",
]
